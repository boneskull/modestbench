pattern: 'test/**/*.bench.ts'
exclude:
  - 'node_modules/**'
  - 'dist/**'
reporters:
  - human
  - json
iterations: 500
time: 2000
warmup: 100
outputDir: './test-output'
quiet: false
verbose: true
bail: false
timeout: 60000
tags:
  - test
  - yaml
metadata:
  format: yaml
  testFile: true
thresholds:
  maxMean: 1000
reporterConfig:
  human:
    showProgress: true
